<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARBA Dueño</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest-panel.json">
<link rel="apple-touch-icon" href="icon-dueno-192.png">
<meta name="apple-mobile-web-app-title" content="ARBA Dueño">
<link rel="icon" href="icon-dueno-192.png">
<style>body{margin:0;background:#050816;color:#eef2f8;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
<div style="max-width:360px;text-align:center;padding:24px">
<img src="icon-dueno-192.png" alt="" style="width:110px;border-radius:24px">
<h2 style="margin:14px 0 6px">ARBA Dueño</h2>
<p id="msg" style="opacity:.85">Tu app privada del negocio.</p>
<div id="inst" hidden style="text-align:left;background:#0b1220;border:1px solid #f4b40066;border-radius:14px;padding:12px 14px;font-size:15px">
<b>Para instalarla en este celular:</b><br>
• <b>Android (Chrome):</b> toca ⋮ arriba a la derecha → <b>Agregar a pantalla principal</b> o <b>Instalar app</b>.<br>
• <b>iPhone (Safari):</b> toca el botón compartir ⬆️ → <b>Agregar a inicio</b>.</div>
<p><a href="./#panel-arba" style="display:inline-block;margin-top:14px;padding:12px 22px;border-radius:999px;background:#f4b400;color:#152016;font-weight:700;text-decoration:none">🔐 Abrir panel</a></p>
</div>
<script>
/* Instalada como app: abre directo el panel (que pide Google + PIN/huella). En el navegador: muestra cómo instalarla. */
var app=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(app){document.getElementById('msg').textContent='🔐 Abriendo…';setTimeout(function(){location.replace('./#panel-arba')},300)}
else document.getElementById('inst').hidden=false;
</script>
</body>
</html>
